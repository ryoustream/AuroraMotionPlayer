# ╔══════════════════════════════════════════════════════════════════╗
# ║  Aurora Motion Player — Windows x64 Build                       ║
# ║  Toolchain : MSVC 2022 · Qt 6.6 · Vulkan SDK · vcpkg           ║
# ║  Artifacts : AuroraPlayer-<ver>-win64.zip                       ║
# ╚══════════════════════════════════════════════════════════════════╝
name: 🪟 Build · Windows x64

on:
  push:
    branches: [main, develop, "release/**"]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: false
        default: "Release"
        type: choice
        options: [Release, Debug, RelWithDebInfo]
  workflow_call:
    inputs:
      build_type:
        type: string
        default: "Release"

# ── Global env ────────────────────────────────────────────────────────────────
env:
  BUILD_TYPE:   ${{ inputs.build_type || github.event.inputs.build_type || 'Release' }}
  VCPKG_ROOT:   ${{ github.workspace }}/vcpkg
  VCPKG_CACHE:  ${{ github.workspace }}/vcpkg-cache
  QT_VERSION:   "6.6.2"
  VULKAN_VER:   "1.3.275.0"
  AURORA_VER:   "1.0.0"

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: "Windows x64 · ${{ inputs.build_type || github.event.inputs.build_type || 'Release' }}"
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────────────────────────────────
      - name: "① Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ─────────────────────────────────────────────────────────────────────
      # 2. CACHE LAYERS
      # ─────────────────────────────────────────────────────────────────────
      - name: "② Cache · vcpkg binaries"
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ env.VCPKG_CACHE }}
          key:          vcpkg-win64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-v6
          restore-keys: vcpkg-win64-

      - name: "② Cache · CMake build"
        uses: actions/cache@v4
        with:
          path: build
          key:          cmake-win64-${{ env.BUILD_TYPE }}-${{ hashFiles('CMakeLists.txt', 'desktop/windows/CMakeLists.txt', 'core/**/*.h') }}-v4
          restore-keys: cmake-win64-${{ env.BUILD_TYPE }}-

      - name: "② Cache · Vulkan SDK"
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_VER }}
          key:  vulkan-sdk-${{ env.VULKAN_VER }}-v3

      # ─────────────────────────────────────────────────────────────────────
      # 3. TOOLS
      # ─────────────────────────────────────────────────────────────────────
      - name: "③ Setup MSVC environment"
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: "③ Install Qt ${{ env.QT_VERSION }}"
        shell: pwsh
        run: |
          pip install aqtinstall --quiet
          $QtDir = "C:\Qt"

          Write-Host "Installing Qt ${{ env.QT_VERSION }}..."
          $Result = aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_msvc2019_64 `
            --outputdir $QtDir `
            --modules qtmultimedia 2>&1
          Write-Host $Result

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::aqt install-qt failed (exit $LASTEXITCODE). Output: $Result"
            # Retry once with verbose flag
            aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_msvc2019_64 `
              --outputdir $QtDir `
              --modules qtmultimedia `
              -v 2>&1
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

          $QtBin = "$QtDir\${{ env.QT_VERSION }}\msvc2019_64"
          echo "Qt6_DIR=$QtBin\lib\cmake\Qt6" >> $env:GITHUB_ENV
          echo "$QtBin\bin" >> $env:GITHUB_PATH
          Write-Host "✓ Qt ${{ env.QT_VERSION }} installed at $QtBin"

      - name: "③ Bootstrap vcpkg"
        shell: pwsh
        run: |
          # Use the pre-installed vcpkg on windows-2022 GitHub-hosted runners
          # (located at C:\vcpkg and pointed to by VCPKG_INSTALLATION_ROOT)
          if ($env:VCPKG_INSTALLATION_ROOT -and (Test-Path "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe")) {
            $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
            Write-Host "✓ Using pre-installed vcpkg at $vcpkgRoot"
          } elseif (Test-Path $env:VCPKG_ROOT) {
            $vcpkgRoot = $env:VCPKG_ROOT
            Write-Host "✓ Using cached vcpkg at $vcpkgRoot"
          } else {
            Write-Host "Cloning vcpkg..."
            git clone --depth=1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
            $vcpkgRoot = $env:VCPKG_ROOT
            & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          }
          echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          echo "VCPKG_EXE=$vcpkgRoot\vcpkg.exe" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $env:VCPKG_CACHE | Out-Null
          Write-Host "✓ vcpkg ready: $(& "$vcpkgRoot\vcpkg.exe" version 2>&1 | head -1)"

      - name: "③ Install Vulkan SDK"
        shell: pwsh
        run: |
          # Check for pre-installed Vulkan SDK on windows-2022 runners
          $sdkPath = Get-ChildItem "C:\VulkanSDK" -ErrorAction SilentlyContinue |
            Where-Object { Test-Path "$($_.FullName)\Include\vulkan\vulkan.h" } |
            Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName

          if ($sdkPath) {
            Write-Host "✓ Pre-installed Vulkan SDK: $sdkPath"
            echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
            echo "$sdkPath\Bin" >> $env:GITHUB_PATH
            echo "AURORA_USE_VULKAN=ON" >> $env:GITHUB_ENV
          } else {
            Write-Host "⚠ No Vulkan SDK found — building with AURORA_USE_VULKAN=OFF"
            echo "VULKAN_SDK=" >> $env:GITHUB_ENV
            echo "AURORA_USE_VULKAN=OFF" >> $env:GITHUB_ENV
          }

      - name: "③ Set Vulkan env"
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"
          Write-Host "AURORA_USE_VULKAN=$env:AURORA_USE_VULKAN"

      # ─────────────────────────────────────────────────────────────────────
      # 4. DEPENDENCIES (vcpkg)
      # ─────────────────────────────────────────────────────────────────────
      - name: "④ Install FFmpeg (pre-built gyan.dev)"
        run: |
          # Use Gyan.dev pre-built FFmpeg shared build — avoids vcpkg Python dependency
          $ffmpegVer = "7.1"
          $ffmpegZip = "$env:TEMP\ffmpeg-shared.zip"
          $ffmpegDir = "$env:GITHUB_WORKSPACE\ffmpeg-shared"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$ffmpegVer/ffmpeg-$ffmpegVer-full_build-shared.zip"

          Write-Host "Downloading FFmpeg $ffmpegVer pre-built shared..."
          Invoke-WebRequest -Uri $url -OutFile $ffmpegZip -TimeoutSec 300
          Expand-Archive -Path $ffmpegZip -DestinationPath $env:GITHUB_WORKSPACE -Force

          $extracted = Get-ChildItem "$env:GITHUB_WORKSPACE" -Directory -Filter "ffmpeg-$ffmpegVer*" | Select-Object -First 1
          Rename-Item $extracted.FullName $ffmpegDir -ErrorAction SilentlyContinue

          echo "FFMPEG_PREFIX=$ffmpegDir" >> $env:GITHUB_ENV
          echo "$ffmpegDir\bin" >> $env:GITHUB_PATH
          Write-Host "✓ FFmpeg at $ffmpegDir"

      - name: "④ Install ONNX Runtime (pre-built)"
        run: |
          $onnxVer = "1.19.2"
          $onnxZip  = "$env:TEMP\onnxruntime.zip"
          $onnxDir  = "$env:GITHUB_WORKSPACE\onnxruntime"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$onnxVer/onnxruntime-win-x64-$onnxVer.zip"

          Write-Host "Downloading ONNX Runtime $onnxVer..."
          Invoke-WebRequest -Uri $url -OutFile $onnxZip -TimeoutSec 180
          Expand-Archive -Path $onnxZip -DestinationPath $env:GITHUB_WORKSPACE -Force

          $extracted = Get-ChildItem "$env:GITHUB_WORKSPACE" -Directory -Filter "onnxruntime-win-x64*" | Select-Object -First 1
          Rename-Item $extracted.FullName $onnxDir -ErrorAction SilentlyContinue

          echo "ONNXRUNTIME_ROOT=$onnxDir" >> $env:GITHUB_ENV
          Write-Host "✓ ONNX Runtime at $onnxDir"

      # ─────────────────────────────────────────────────────────────────────
      # 5. CMAKE CONFIGURE
      # ─────────────────────────────────────────────────────────────────────
      - name: "⑤ CMake · Configure"
        shell: pwsh
        run: |
          $useVulkan = if ($env:AURORA_USE_VULKAN -eq "ON") { "ON" } else { "OFF" }
          Write-Host "AURORA_USE_VULKAN=$useVulkan"
          Write-Host "Qt6_DIR=$env:Qt6_DIR"
          Write-Host "FFMPEG_PREFIX=$env:FFMPEG_PREFIX"

          $cmakeArgs = @(
            "-B", "build",
            "-G", "Visual Studio 17 2022", "-A", "x64",
            "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE",
            "-DAURORA_VERSION=$env:AURORA_VER",
            "-DAURORA_BUILD_DESKTOP=ON",
            "-DAURORA_BUILD_TESTS=ON",
            "-DAURORA_USE_VULKAN=$useVulkan",
            "-DAURORA_USE_DX11=ON",
            "-DAURORA_USE_DX12=ON",
            "-DAURORA_NCNN=OFF",
            "-DAURORA_ONNX=OFF",
            "-DQt6_DIR=$env:Qt6_DIR",
            "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
          )
          if ($env:FFMPEG_PREFIX) {
            $cmakeArgs += "-DFFMPEG_PREFIX=$env:FFMPEG_PREFIX"
          }
          if ($env:VULKAN_SDK) {
            $cmakeArgs += "-DVULKAN_SDK=$env:VULKAN_SDK"
          }

          $output = & cmake @cmakeArgs 2>&1
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
            # Emit last 30 lines as error annotations
            ($output | Select-Object -Last 30) | ForEach-Object {
              Write-Host "::error::$_"
            }
            exit $LASTEXITCODE
          }

      # ─────────────────────────────────────────────────────────────────────
      # 6. BUILD
      # ─────────────────────────────────────────────────────────────────────
      - name: "⑥ CMake · Build"
        run: |
          cmake --build build `
            --config $env:BUILD_TYPE `
            --parallel $env:NUMBER_OF_PROCESSORS `
            -- /verbosity:minimal /nologo /p:WarningLevel=3

      # ─────────────────────────────────────────────────────────────────────
      # 7. TEST
      # ─────────────────────────────────────────────────────────────────────
      - name: "⑦ CTest · Run"
        working-directory: build
        run: |
          ctest -C $env:BUILD_TYPE `
            --output-on-failure `
            --timeout 120 `
            -j4 `
            --test-output-size-failed 65536

      - name: "⑦ Upload test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-Windows-${{ env.BUILD_TYPE }}
          path: build/Testing/**/*.xml
          retention-days: 14
          if-no-files-found: ignore

      # ─────────────────────────────────────────────────────────────────────
      # 8. PACKAGE (Release only)
      # ─────────────────────────────────────────────────────────────────────
      - name: "⑧ Deploy Qt DLLs"
        if: env.BUILD_TYPE == 'Release'
        run: |
          $exe = "build\bin\Release\AuroraPlayer.exe"
          if (-not (Test-Path $exe)) { $exe = "build\desktop\windows\Release\AuroraPlayer.exe" }
          $wdq = "$env:Qt6_DIR\..\..\..\bin\windeployqt.exe"
          if ((Test-Path $exe) -and (Test-Path $wdq)) {
            & $wdq --release --no-translations --no-system-d3d-compiler "$exe"
            echo "✓ windeployqt done"
          } else {
            echo "⚠ Executable or windeployqt not found — skipping deploy"
          }

      - name: "⑧ Create ZIP package"
        if: env.BUILD_TYPE == 'Release'
        run: |
          $pkg = "AuroraPlayer-$env:AURORA_VER-win64"
          New-Item -ItemType Directory -Force $pkg | Out-Null

          # Copy exe + DLLs
          $binDirs = @(
            "build\bin\Release",
            "build\desktop\windows\Release",
            "build\Release"
          )
          foreach ($d in $binDirs) {
            if (Test-Path $d) {
              Copy-Item "$d\*" "$pkg\" -Recurse -Force
              echo "✓ Copied from $d"
              break
            }
          }

          Compress-Archive -Path $pkg -DestinationPath "$pkg.zip" -Force
          echo "PACKAGE_NAME=$pkg" >> $env:GITHUB_ENV
          echo "✓ Package: $pkg.zip"
          Get-Item "$pkg.zip" | Select-Object Name, Length

      - name: "⑧ Upload package artifact"
        uses: actions/upload-artifact@v4
        with:
          name: AuroraPlayer-Windows-x64-${{ env.BUILD_TYPE }}
          path: AuroraPlayer-*.zip
          if-no-files-found: warn
          retention-days: 30

      # ─────────────────────────────────────────────────────────────────────
      # 9. BUILD SUMMARY
      # ─────────────────────────────────────────────────────────────────────
      - name: "⑨ Job Summary"
        if: always()
        run: |
          $status = if ($?) { "✅ Success" } else { "❌ Failed" }
          $body = @"
          ## 🪟 Windows Build Summary
          | Field        | Value |
          |---|---|
          | **Status**   | $status |
          | **Type**     | $env:BUILD_TYPE |
          | **Qt**       | $env:QT_VERSION |
          | **Vulkan**   | $env:VULKAN_VER |
          | **Commit**   | ${{ github.sha }} |
          "@
          $body | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
