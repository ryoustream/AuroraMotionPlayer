# .github/codeql-config.yml
# CodeQL configuration for Aurora Motion Player

name: "Aurora Motion Player CodeQL Config"

paths:
  - core
  - desktop/windows/src
  - mobile/android/app/src/main/kotlin
  - mobile/android/app/src/main/jni

paths-ignore:
  - third_party
  - "**/*.md"
  - "build/**"
  - "vcpkg/**"
  - "tools/scripts"

queries:
  - uses: security-extended
  - uses: security-and-quality

query-filters:
  # Suppress noisy low-severity items from generated code
  - exclude:
      problem.severity: recommendation
      id:
        - cpp/poorly-documented-function
        - cpp/missing-return
