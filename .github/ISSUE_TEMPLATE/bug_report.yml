name: 🐛 Bug Report
description: Report a defect or unexpected behaviour in Aurora Motion Player
labels: ["bug", "needs-repro"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: Aurora Version
      description: Found in `Help → About` or the `VERSION` file
      placeholder: "0.9.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 10 x64
        - Windows 11 x64
        - Android 11
        - Android 12
        - Android 13
        - Android 14
        - Other
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU & Driver Version
      placeholder: "NVIDIA RTX 3060, driver 551.86"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear, concise description of what the bug is
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open file '...'
        2. Enable AI interpolation
        3. Seek to position 01:23
        4. Observe crash / wrong behaviour
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
    validations:
      required: true

  - type: input
    id: video_format
    attributes:
      label: Video File Format (if relevant)
      placeholder: "MKV H.265 4K HDR10"

  - type: dropdown
    id: ai_mode
    attributes:
      label: AI Mode Active
      options:
        - None (disabled)
        - Interpolation only
        - Upscaling only
        - Both
        - Unknown

  - type: textarea
    id: logs
    attributes:
      label: Log Output
      description: |
        Attach logs from `%APPDATA%\Aurora\logs\` (Windows)
        or run `adb logcat -s AuroraPlayer:V` (Android).
        Wrap in ```text code fences```.
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before filing this one
          required: true
        - label: I can reproduce this with a fresh install / clean config
          required: false
