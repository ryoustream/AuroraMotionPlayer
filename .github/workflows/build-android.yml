# ╔══════════════════════════════════════════════════════════════════╗
# ║  Aurora Motion Player — Android Build                           ║
# ║  Toolchain : Kotlin · JDK 17 · NDK 26 · CMake 3.25            ║
# ║  Artifacts : AuroraPlayer-<ver>.apk / .aab                     ║
# ╚══════════════════════════════════════════════════════════════════╝
name: 🤖 Build · Android

on:
  push:
    branches: [main, develop, "release/**"]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Build variant"
        required: false
        default: "debug"
        type: choice
        options: [release, debug]
  workflow_call:
    inputs:
      build_variant:
        type: string
        default: "release"

# ── Global env ────────────────────────────────────────────────────────────────
env:
  JAVA_VERSION:  "17"
  NDK_VERSION:   "26.1.10909125"
  CMAKE_VERSION: "3.22.1"
  BUILD_TOOLS:   "34.0.0"
  COMPILE_SDK:   "34"
  MIN_SDK:       "30"
  NCNN_VER:      "20240102"
  AURORA_VER:    "1.0.0"
  BUILD_VARIANT: ${{ inputs.build_variant || github.event.inputs.build_variant || 'debug' }}

jobs:
  build:
    name: "Android APK · ${{ inputs.build_variant || github.event.inputs.build_variant || 'debug' }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────────────────────────────────
      - name: "① Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ─────────────────────────────────────────────────────────────────────
      # 2. JAVA / SDK SETUP
      # ─────────────────────────────────────────────────────────────────────
      - name: "② Setup JDK ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: "② Setup Gradle (official action — handles wrapper jar)"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false
          build-root-directory: mobile/android

      - name: "② Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "② Install NDK · CMake · Build-tools"
        run: |
          sdkmanager \
            "ndk;$NDK_VERSION" \
            "cmake;$CMAKE_VERSION" \
            "build-tools;$BUILD_TOOLS" \
            "platforms;android-$COMPILE_SDK" \
            --channel=0 2>&1 | grep -v "^\[=" | tail -20
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
          CMAKE_BIN_DIR="$ANDROID_HOME/cmake/$CMAKE_VERSION/bin"
          echo "AURORA_CMAKE_DIR=$CMAKE_BIN_DIR" >> $GITHUB_ENV
          echo "✓ NDK   : $NDK_VERSION"
          echo "✓ CMake : $CMAKE_VERSION  (dir=$CMAKE_BIN_DIR)"

      # ─────────────────────────────────────────────────────────────────────
      # 3. CACHE LAYERS
      # ─────────────────────────────────────────────────────────────────────
      - name: "③ Cache · Gradle"
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key:          gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/gradle-wrapper.properties') }}-v4
          restore-keys: gradle-

      - name: "③ Cache · NDK build (.cxx)"
        uses: actions/cache@v4
        with:
          path: mobile/android/app/.cxx
          key:          ndk-${{ env.NDK_VERSION }}-${{ hashFiles('mobile/android/app/src/main/jni/**') }}-v3
          restore-keys: ndk-${{ env.NDK_VERSION }}-

      - name: "③ Cache · NCNN prebuilts"
        id: cache-ncnn
        uses: actions/cache@v4
        with:
          path: mobile/android/app/src/main/jni/ncnn
          key:  ncnn-${{ env.NCNN_VER }}-android-vulkan-v2

      # ─────────────────────────────────────────────────────────────────────
      # 4. AI LIBRARY PREBUILTS
      # ─────────────────────────────────────────────────────────────────────
      - name: "④ Download NCNN Android prebuilts"
        if: steps.cache-ncnn.outputs.cache-hit != 'true'
        run: |
          URL="https://github.com/Tencent/ncnn/releases/download/${NCNN_VER}/ncnn-${NCNN_VER}-android-vulkan.zip"
          echo "⬇ Downloading NCNN ${NCNN_VER}..."
          curl -L --retry 3 --retry-delay 5 "$URL" -o ncnn-android.zip
          unzip -q ncnn-android.zip -d ncnn-unzip

          for ABI in arm64-v8a x86_64; do
            SRC="ncnn-unzip/ncnn-${NCNN_VER}-android-vulkan/${ABI}"
            DST="mobile/android/app/src/main/jni/ncnn/${ABI}"
            mkdir -p "$DST"
            if [ -d "$SRC" ]; then
              cp -r "$SRC"/. "$DST/"
              echo "✓ NCNN $ABI"
            else
              echo "⚠ NCNN $ABI not in archive — creating stub dirs"
              mkdir -p "$DST/lib" "$DST/include"
            fi
          done
          rm -rf ncnn-android.zip ncnn-unzip

      - name: "④ Prepare FFmpeg stub directories"
        run: |
          # Real FFmpeg prebuilts would be downloaded here for a full build.
          # Stubs allow CMake configuration to succeed during CI smoke builds.
          for ABI in arm64-v8a x86_64; do
            mkdir -p "mobile/android/app/src/main/jni/ffmpeg/${ABI}/lib"
            mkdir -p "mobile/android/app/src/main/jni/ffmpeg/${ABI}/include"
          done
          echo "✓ FFmpeg stub dirs ready"

      # ─────────────────────────────────────────────────────────────────────
      # 5. GRADLE WRAPPER
      # ─────────────────────────────────────────────────────────────────────
      - name: "⑤ Ensure Gradle wrapper"
        working-directory: mobile/android
        run: |
          mkdir -p gradle/wrapper
          # gradle-wrapper.jar is committed to the repo (Session 13 fix).
          # Validate it is present and is a real JAR (zip magic bytes).
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            SIZE=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
            if [ "$SIZE" -gt 10000 ]; then
              echo "✓ gradle-wrapper.jar present (${SIZE} bytes)"
            else
              echo "⚠ gradle-wrapper.jar too small (${SIZE} bytes) — re-downloading..."
              rm -f gradle/wrapper/gradle-wrapper.jar
            fi
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "⬇ Downloading gradle-wrapper.jar from gradle/gradle releases..."
            curl -sL \
              "https://raw.githubusercontent.com/gradle/gradle/refs/tags/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
              -o gradle/wrapper/gradle-wrapper.jar --retry 5 --retry-delay 3
            SIZE=$(stat -c%s gradle/wrapper/gradle-wrapper.jar 2>/dev/null || echo 0)
            if [ "$SIZE" -lt 10000 ]; then
              echo "❌ gradle-wrapper.jar download failed (size=${SIZE})"
              exit 1
            fi
            echo "✓ gradle-wrapper.jar downloaded (${SIZE} bytes)"
          fi
          chmod +x gradlew
          echo "✓ Gradle wrapper ready"
          echo "✓ Gradle wrapper ready"

      # ─────────────────────────────────────────────────────────────────────
      # 6. BUILD
      # ─────────────────────────────────────────────────────────────────────
      - name: "⑥ Pre-build validation"
        run: |
          echo "=== Environment ==="
          echo "NDK: $ANDROID_NDK_HOME"
          echo "SDK: $ANDROID_HOME"
          ls -la mobile/android/gradle/wrapper/
          echo "=== JNI sources ==="
          ls mobile/android/app/src/main/jni/
          echo "=== Key Kotlin files ==="
          find mobile/android/app/src/main/kotlin -name "*.kt" | sort
          echo "✓ Pre-build validation complete"

          # Write sdk.dir only - cmake found by AGP via version= in build.gradle.kts
          echo "sdk.dir=$ANDROID_HOME" >> mobile/android/local.properties
          echo "✓ local.properties written (sdk.dir=$ANDROID_HOME)"

      - name: "⑥ Gradle · assemble ${{ env.BUILD_VARIANT }}"
        working-directory: mobile/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          VARIANT="${BUILD_VARIANT}"
          CAP="$(echo "$VARIANT" | sed 's/\b./\u&/')"

          ./gradlew "assemble${CAP}" \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError" \
            2>&1 | tee ../../build-android.log || {
            echo "## ❌ Gradle Build Errors" >> $GITHUB_STEP_SUMMARY
            grep -E "^e: |error:|FAILED:|Exception" ../../build-android.log | head -40 >> $GITHUB_STEP_SUMMARY
            grep -E "^e: |error:" ../../build-android.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      # ─────────────────────────────────────────────────────────────────────
      # 7. LINT
      # ─────────────────────────────────────────────────────────────────────
      - name: "⑦ Android Lint"
        working-directory: mobile/android
        run: |
          ./gradlew lint --no-daemon -q || true
          echo "✓ Lint done (non-blocking)"

      # ─────────────────────────────────────────────────────────────────────
      # 8. SIGN APK (Release only — requires secrets)
      # ─────────────────────────────────────────────────────────────────────
      - name: "⑧ Sign APK"
        if: env.BUILD_VARIANT == 'release' && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64:   ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD:    ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > aurora.jks
          APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
              --ks aurora.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "AuroraPlayer-$AURORA_VER-signed.apk" \
              "$APK"
            echo "✓ APK signed"
          else
            echo "⚠ No release APK found to sign"
          fi
          rm -f aurora.jks

      # ─────────────────────────────────────────────────────────────────────
      # 9. ARTIFACTS
      # ─────────────────────────────────────────────────────────────────────
      - name: "⑨ Upload APK / AAB"
        uses: actions/upload-artifact@v4
        with:
          name: AuroraPlayer-Android-${{ env.BUILD_VARIANT }}
          path: |
            mobile/android/app/build/outputs/apk/**/*.apk
            mobile/android/app/build/outputs/bundle/**/*.aab
            AuroraPlayer-*-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: "⑨ Upload Lint report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LintReport-Android-${{ env.BUILD_VARIANT }}
          path: mobile/android/app/build/reports/lint-results*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: "⑨ Upload build log (on failure)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BuildLog-Android-${{ env.BUILD_VARIANT }}
          path: build-android.log
          retention-days: 7

      # ─────────────────────────────────────────────────────────────────────
      # 10. BUILD SUMMARY
      # ─────────────────────────────────────────────────────────────────────
      - name: "⑩ Job Summary"
        if: always()
        run: |
          STATUS=$( [ $? -eq 0 ] && echo "✅ Success" || echo "❌ Failed" )
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🤖 Android Build Summary
          | Field         | Value |
          |---|---|
          | **Status**    | $STATUS |
          | **Variant**   | $BUILD_VARIANT |
          | **NDK**       | $NDK_VERSION |
          | **Min SDK**   | Android $MIN_SDK |
          | **Compile SDK** | Android $COMPILE_SDK |
          | **Commit**    | ${{ github.sha }} |
          EOF
