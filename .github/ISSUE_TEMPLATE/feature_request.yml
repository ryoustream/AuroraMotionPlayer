name: ✨ Feature Request
description: Propose a new feature or enhancement
labels: ["feature"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search existing issues to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this feature solve? Why do you need it?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature in detail
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you considered and why you prefer this one

  - type: dropdown
    id: platform
    attributes:
      label: Target Platform
      multiple: true
      options:
        - Windows
        - Android
        - Both

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Frame Interpolation (AI)
        - Upscaling (AI)
        - Subtitle Engine
        - Audio Engine
        - HDR / Tone Mapping
        - Renderer (GPU)
        - Decoder
        - UI — Windows
        - UI — Android
        - Plugin System
        - Network / Streaming
        - Benchmark / Overlay
        - Installer
        - CI / Build System
        - Documentation
        - Other

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, references, or links to similar features in other players

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before submitting
          required: true
        - label: I am willing to contribute a PR for this feature
          required: false
