name: 🪟 Build Windows

on:
  push:
    branches: [main, develop, "release/**"]
    paths-ignore: ["*.md", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: false
        default: "Release"
        type: choice
        options: [Release, Debug, RelWithDebInfo]
  workflow_call:
    inputs:
      build_type:
        type: string
        default: "Release"

env:
  BUILD_TYPE:   ${{ inputs.build_type || github.event.inputs.build_type || 'Release' }}
  VCPKG_ROOT:   ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
  VULKAN_VER:   "1.3.275.0"

jobs:
  build:
    name: "Windows x64 (${{ inputs.build_type || github.event.inputs.build_type || 'Release' }})"
    runs-on: windows-2022

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: "⬇ Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── Cache: vcpkg binary ────────────────────────────────────────────────
      - name: "🗂 Cache vcpkg"
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key:          vcpkg-win64-${{ hashFiles('vcpkg.json') }}-v3
          restore-keys: vcpkg-win64-

      # ── Install vcpkg ──────────────────────────────────────────────────────
      - name: "📦 Bootstrap vcpkg"
        shell: pwsh
        run: |
          if (-not (Test-Path $env:VCPKG_ROOT)) {
            git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          }
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          echo "VCPKG_EXE=$env:VCPKG_ROOT\vcpkg.exe" >> $env:GITHUB_ENV

      # ── Qt6 ───────────────────────────────────────────────────────────────
      - name: "🎨 Install Qt6"
        uses: jurplel/install-qt-action@v3
        with:
          version:  "6.6.2"
          host:     windows
          target:   desktop
          arch:     win64_msvc2019_64
          modules:  "qtmultimedia qtnetwork"
          cache:    true

      # ── Vulkan SDK ────────────────────────────────────────────────────────
      - name: "🌋 Cache Vulkan SDK"
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_VER }}
          key:  vulkan-sdk-${{ env.VULKAN_VER }}

      - name: "🌋 Install Vulkan SDK"
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VER/windows/VulkanSDK-$env:VULKAN_VER-Installer.exe"
          $out = "$env:TEMP\VulkanSDK.exe"
          Invoke-WebRequest -Uri $url -OutFile $out -TimeoutSec 300
          Start-Process -FilePath $out `
            -ArgumentList "--accept-licenses --default-answer --confirm-command install" `
            -Wait -NoNewWindow

      - name: "🌋 Set Vulkan env"
        shell: pwsh
        run: |
          echo "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VER" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\$env:VULKAN_VER\Bin" >> $env:GITHUB_PATH

      # ── FFmpeg via vcpkg ───────────────────────────────────────────────────
      - name: "🎬 Install FFmpeg (vcpkg)"
        shell: pwsh
        run: |
          & $env:VCPKG_EXE install `
            "ffmpeg[core,avcodec,avformat,avutil,swscale,swresample]:x64-windows" `
            --triplet x64-windows --no-print-usage 2>&1

      # ── Configure CMake ───────────────────────────────────────────────────
      - name: "⚙ Configure CMake"
        shell: pwsh
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DAURORA_BUILD_DESKTOP=ON `
            -DAURORA_BUILD_TESTS=ON `
            -DAURORA_USE_VULKAN=ON `
            -DAURORA_USE_DX11=ON `
            -DFFMPEG_PREFIX="$env:VCPKG_ROOT/installed/x64-windows" `
            -DQt6_DIR="$env:Qt6_DIR" `
            -DVULKAN_SDK="$env:VULKAN_SDK"

      # ── Build ─────────────────────────────────────────────────────────────
      - name: "🔨 Build"
        shell: pwsh
        run: |
          cmake --build build `
            --config $env:BUILD_TYPE `
            --parallel $env:NUMBER_OF_PROCESSORS `
            -- /verbosity:minimal /nologo

      # ── Tests ─────────────────────────────────────────────────────────────
      - name: "🧪 Run Tests"
        shell: pwsh
        working-directory: build
        run: |
          ctest -C $env:BUILD_TYPE --output-on-failure --timeout 60 -j4
        continue-on-error: false

      # ── Upload test results ────────────────────────────────────────────────
      - name: "📊 Upload Test Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-Windows-x64-${{ env.BUILD_TYPE }}
          path: build/Testing/**/*.xml
          retention-days: 14

      # ── Package ───────────────────────────────────────────────────────────
      - name: "📦 Package (Release)"
        if: env.BUILD_TYPE == 'Release'
        shell: pwsh
        run: |
          $exePath = "build\bin\$env:BUILD_TYPE\AuroraPlayer.exe"
          if (Test-Path $exePath) {
            $winDeployQt = "$env:Qt6_DIR\..\..\..\bin\windeployqt.exe"
            if (Test-Path $winDeployQt) {
              & $winDeployQt --release --no-translations $exePath
            }
          }

          $ver  = "1.0.0"
          $arch = "win64"
          $pkg  = "AuroraPlayer-${ver}-${arch}"

          New-Item -ItemType Directory -Force $pkg | Out-Null
          if (Test-Path "build\bin\$env:BUILD_TYPE") {
            Copy-Item "build\bin\$env:BUILD_TYPE\*" "$pkg\" -Recurse -Force
          }
          Compress-Archive -Path $pkg -DestinationPath "${pkg}.zip" -Force
          echo "PACKAGE_ZIP=${pkg}.zip" >> $env:GITHUB_ENV
          echo "Packaged: ${pkg}.zip"

      # ── Upload package ─────────────────────────────────────────────────────
      - name: "⬆ Upload Package"
        uses: actions/upload-artifact@v4
        with:
          name: AuroraPlayer-Windows-x64-${{ env.BUILD_TYPE }}
          path: |
            AuroraPlayer-*.zip
          if-no-files-found: warn
          retention-days: 30
