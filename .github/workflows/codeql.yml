name: 🔐 CodeQL Security Analysis

on:
  push:
    branches: [main, develop, "release/**"]
    paths:
      - "core/**"
      - "desktop/**"
      - "mobile/android/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sunday 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions:       read
  contents:      read
  security-events: write

jobs:
  # ── C++ Analysis ──────────────────────────────────────────────────────────
  analyze-cpp:
    name: "🔐 CodeQL C++ (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            build_cmd: |
              cmake -B build-codeql -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DAURORA_BUILD_DESKTOP=OFF \
                -DAURORA_BUILD_TESTS=OFF \
                -DAURORA_USE_VULKAN=OFF
              cmake --build build-codeql --parallel 4

    steps:
      - name: "⬇ Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "📦 Install dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            libvulkan-dev \
            pkg-config

      - name: "🔐 Initialize CodeQL"
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          config-file: ./.github/codeql-config.yml
          queries: >-
            security-extended,
            security-and-quality

      - name: "🔨 Build for CodeQL"
        run: ${{ matrix.build_cmd }}

      - name: "📊 Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"
          upload: true

  # ── Kotlin Analysis ───────────────────────────────────────────────────────
  analyze-kotlin:
    name: "🔐 CodeQL Kotlin (Android)"
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: "⬇ Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "☕ Setup JDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: "🔐 Initialize CodeQL"
        uses: github/codeql-action/init@v3
        with:
          languages: kotlin
          queries: >-
            security-extended,
            security-and-quality

      - name: "🔨 Build Kotlin for CodeQL"
        uses: github/codeql-action/autobuild@v3

      - name: "📊 Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:kotlin"
          upload: true

  # ── Secret Scanning Summary ───────────────────────────────────────────────
  secret-scan:
    name: "🔑 Secret Scan (Gitleaks)"
    runs-on: ubuntu-22.04

    steps:
      - name: "⬇ Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 Run Gitleaks"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ── SAST summary gate ─────────────────────────────────────────────────────
  security-gate:
    name: "🛡 Security Gate"
    runs-on: ubuntu-22.04
    needs: [analyze-cpp, analyze-kotlin, secret-scan]
    if: always()

    steps:
      - name: "✅ Security Gate Check"
        run: |
          echo "┌─────────────────────────────────────────┐"
          echo "│  Aurora Motion Player Security Summary  │"
          echo "├─────────────────────────────────────────┤"
          echo "│  CodeQL C++     : ${{ needs.analyze-cpp.result }}"
          echo "│  CodeQL Kotlin  : ${{ needs.analyze-kotlin.result }}"
          echo "│  Secret Scan    : ${{ needs.secret-scan.result }}"
          echo "└─────────────────────────────────────────┘"

          # Fail if CodeQL analyses actually failed (not just skipped/cancelled)
          if [[ "${{ needs.analyze-cpp.result }}"    == "failure" ]] || \
             [[ "${{ needs.analyze-kotlin.result }}" == "failure" ]]; then
            echo "❌ Security analysis failed"
            exit 1
          fi
          echo "✅ Security gate passed"
