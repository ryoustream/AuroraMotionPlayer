name: 🤖 AI Model Request
description: Request integration of a new AI model for interpolation, upscaling, or denoising
labels: ["ai-model", "feature"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Aurora integrates open-source AI models. All models must be licensed for commercial use.

  - type: input
    id: model_name
    attributes:
      label: Model Name
      placeholder: "RIFE v5.0 / EfficientSR / etc."
    validations:
      required: true

  - type: dropdown
    id: task
    attributes:
      label: Task Type
      options:
        - Frame Interpolation
        - Super-Resolution / Upscaling
        - Denoising
        - Scene Detection / Classification
        - Other
    validations:
      required: true

  - type: input
    id: paper
    attributes:
      label: Paper / Repository URL
      placeholder: "https://arxiv.org/abs/..."

  - type: input
    id: weights_url
    attributes:
      label: Pre-trained Weights URL
      placeholder: "https://github.com/.../releases"
    validations:
      required: true

  - type: dropdown
    id: license
    attributes:
      label: Model License
      options:
        - MIT
        - Apache 2.0
        - BSD 2-Clause
        - BSD 3-Clause
        - CC BY 4.0
        - CC BY-NC 4.0 (non-commercial — NOT suitable)
        - Other (specify in notes)
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: Available Format
      multiple: true
      options:
        - NCNN (.param + .bin)
        - ONNX
        - PyTorch (.pth) — requires conversion
        - TensorFlow — requires conversion

  - type: textarea
    id: benchmark
    attributes:
      label: Benchmark / Quality Evidence
      description: |
        Include PSNR/SSIM scores, FPS benchmarks, or comparisons to existing Aurora models.

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: The model license permits commercial use
          required: true
        - label: Pre-trained weights are publicly available
          required: true
        - label: I am willing to help with integration / testing
          required: false
