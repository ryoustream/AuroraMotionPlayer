name: 🔐 CodeQL Security Analysis

on:
  push:
    branches: [main, develop, "release/**"]
    paths:
      - "core/**"
      - "desktop/**"
      - "mobile/android/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions:         read
  contents:        read
  security-events: write

jobs:
  # ── C++ Analysis ────────────────────────────────────────────────────────────
  analyze-cpp:
    name: "🔐 CodeQL C++ (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04

    steps:
      - name: "⬇ Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "📦 Install dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            libvulkan-dev libfreetype6-dev \
            pkg-config

      - name: "🔐 Initialize CodeQL"
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: >-
            security-extended,
            security-and-quality

      - name: "🔨 Build for CodeQL"
        run: |
          cmake -B build-codeql -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAURORA_BUILD_DESKTOP=OFF \
            -DAURORA_BUILD_TESTS=OFF \
            -DAURORA_USE_VULKAN=OFF \
            -DAURORA_NCNN=OFF \
            -DAURORA_ONNX=OFF
          cmake --build build-codeql --parallel 4

      - name: "📊 Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
          upload: true

  # ── Kotlin Analysis ─────────────────────────────────────────────────────────
  analyze-kotlin:
    name: "🔐 CodeQL Kotlin (Android)"
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: "⬇ Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "☕ Setup JDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: "⚙ Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-root-directory: mobile/android

      - name: "🔐 Initialize CodeQL"
        uses: github/codeql-action/init@v4
        with:
          languages: kotlin
          build-mode: manual
          queries: >-
            security-extended,
            security-and-quality

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Install NDK + build-tools"
        run: |
          sdkmanager \
            "ndk;26.1.10909125" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            --channel=0 2>&1 | tail -5

      - name: "Ensure Gradle wrapper"
        working-directory: mobile/android
        run: |
          mkdir -p gradle/wrapper
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            SIZE=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
            if [ "$SIZE" -gt 10000 ]; then
              echo "✓ gradle-wrapper.jar present (${SIZE} bytes)"
            else
              rm -f gradle/wrapper/gradle-wrapper.jar
            fi
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sL \
              "https://raw.githubusercontent.com/gradle/gradle/refs/tags/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
              -o gradle/wrapper/gradle-wrapper.jar --retry 5 --retry-delay 3
            echo "✓ gradle-wrapper.jar downloaded"
          fi
          chmod +x gradlew

      - name: "🔨 Build Kotlin for CodeQL"
        working-directory: mobile/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew compileDebugKotlin \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g" \
            2>&1 | tail -60

      - name: "📊 Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:kotlin"
          upload: true

  # ── Secret Scanning ──────────────────────────────────────────────────────────
  secret-scan:
    name: "🔑 Secret Scan (Gitleaks)"
    runs-on: ubuntu-22.04

    steps:
      - name: "⬇ Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 Run Gitleaks"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ── Security Gate ────────────────────────────────────────────────────────────
  security-gate:
    name: "🛡 Security Gate"
    runs-on: ubuntu-22.04
    needs: [analyze-cpp, analyze-kotlin, secret-scan]
    if: always()

    steps:
      - name: "✅ Security Gate Check"
        run: |
          echo "┌─────────────────────────────────────────┐"
          echo "│  Aurora Motion Player Security Summary  │"
          echo "├─────────────────────────────────────────┤"
          echo "│  CodeQL C++     : ${{ needs.analyze-cpp.result }}"
          echo "│  CodeQL Kotlin  : ${{ needs.analyze-kotlin.result }}"
          echo "│  Secret Scan    : ${{ needs.secret-scan.result }}"
          echo "└─────────────────────────────────────────┘"

          if [[ "${{ needs.analyze-cpp.result }}" == "failure" ]]; then
            echo "❌ Security analysis failed (C++ CodeQL)"
            exit 1
          fi
          echo "✅ Security gate passed"
